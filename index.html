<!DOCTYPE html>
<html>
<head>
  <!-- Import Vega & Vega-Lite (does not have to be from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>
  
  
  <!-- CSS file -->
  <link rel="stylesheet" type="text/css" href="css/styles.css" media="all">
  
  <title>A2 Map</title>
</head>
<body>
  
<div class="visualization-container">
  <div id="symbol_map"></div>
  <div id="scatter_plot"></div>
  <div id="operations_dashboard"></div>
  <div class="donut-container">
    <div id="businesses_donut"></div>
    <div id="employment_donut"></div>
    <div id="income_donut"></div>
  </div>
</div>

<script type="text/javascript">

  var spec = "js/a2_map.vg.json";
  vegaEmbed('#symbol_map', spec).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);

  var scatterSpec = "js/scatter_plot.vg.json";
  vegaEmbed('#scatter_plot', scatterSpec).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);

  var operationsSpec = "js/operations_dashboard.vg.json";
  vegaEmbed('#operations_dashboard', operationsSpec).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);

  var businessesSpec = "js/businesses_donut.vg.json";
  vegaEmbed('#businesses_donut', businessesSpec).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);

  var employmentSpec = "js/employment_donut.vg.json";
  vegaEmbed('#employment_donut', employmentSpec).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);

  var incomeSpec = "js/income_donut.vg.json";
  vegaEmbed('#income_donut', incomeSpec).then(function(result) {
    // Access the Vega view instance (https://vega.github.io/vega/docs/api/view/) as result.view
  }).catch(console.error);
</script>

</body>
</html>
